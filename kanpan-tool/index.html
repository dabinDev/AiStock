<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/app-icon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/app-icon.png" />
  <title>A股复盘交易台</title>
  <link rel="stylesheet" href="/assets/workspace.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div><div class="app-eyebrow">MARKET WORKSPACE</div><h1 class="app-title">A股看盘工作台</h1><div class="app-subtitle">盘前定预期 · 盘中看变化 · 盘后做复盘</div></div>
      <div class="quote-note" role="note" aria-label="看盘提示"><span id="sidebarQuoteText" aria-live="polite">先核对数据，再阅读结论。</span><span id="sidebarQuoteMeta"></span></div>
      <div class="context-controls">
        <div class="context-field"><label for="tradeDate">交易日期</label><input id="tradeDate" type="date" list="archiveDates" /><datalist id="archiveDates"></datalist></div>
        <div class="model-badge">本次模型<strong id="currentModelLabel">加载中</strong></div>
        <button id="settingsToggle" class="btn-ghost" onclick="toggleSettings()">模型设置</button>
      </div>
      <button class="btn-ghost btn-mini quote-switch" onclick="rotateSidebarQuote()" title="每 10 秒自动切换，点击立即换一句">换一句 <span aria-hidden="true">↻</span></button>
    </header>
    <details id="settingsPanel" class="settings-panel"><summary>模型与密钥配置</summary>
      <div class="settings-fields">
        <div class="settings-field"><label for="kimiKey">API 密钥 <span>留空沿用已保存的密钥</span></label>
          <div class="input-action"><input id="kimiKey" type="password" autocomplete="new-password" spellcheck="false" aria-describedby="kimiKeyHint" placeholder="需要更换时，在这里粘贴新密钥" /><button id="clearKeyButton" class="btn-ghost" onclick="clearKeyInput()">清空输入</button></div><div id="kimiKeyHint" class="field-hint">正在读取配置…</div>
        </div>
        <div class="settings-field"><label for="kimiModel">本次使用模型 <span>可输入，也可从列表选择</span></label>
          <div class="input-action"><input id="kimiModel" value="%DEFAULT_MODEL%" autocomplete="off" spellcheck="false" placeholder="输入模型 ID" aria-describedby="modelConfigFeedback" /><button id="fetchModelsButton" class="btn-secondary" onclick="fetchKimiModels()">获取模型列表</button></div>
          <select id="kimiModelOptions" class="model-picker" aria-label="选择可用模型" hidden></select>
          <div class="field-hint">可直接输入模型 ID，或获取列表后选择。保存后才更新默认配置。</div>
        </div>
      </div>
      <div class="settings-footer"><div id="modelConfigFeedback" class="field-hint model-feedback" role="status" aria-live="polite">模型测试仅发送简短消息，可能产生调用费用。</div><div class="button-grid"><button id="testModelButton" class="btn-secondary" onclick="testSelectedModel()">测试模型</button><button id="saveSettingsButton" class="btn-save" onclick="saveSettings()">保存默认配置</button></div></div>
    </details>
    <main class="workspace">
      <div class="analysis-column">
        <section class="card analysis-setup" aria-labelledby="analysisSetupTitle">
          <div class="setup-heading"><div><h2 id="analysisSetupTitle">AI 看盘</h2><p>选好场景和资料，开始本次分析</p></div><button id="refreshStateButton" class="btn-ghost btn-mini" onclick="refreshState().catch(err => setStatus(err.message))">刷新状态</button></div>
          <div id="sceneSelect" class="scene-tabs" role="group" aria-label="分析场景">
            <button type="button" data-scene="open" onclick="selectScene('open')"><strong>盘前解析</strong><span>竞价与开盘预期</span></button>
            <button type="button" data-scene="intraday" onclick="selectScene('intraday')"><strong>盘中解析</strong><span>异动与情绪变化</span></button>
            <button type="button" data-scene="close" onclick="selectScene('close')"><strong>盘后复盘</strong><span>全天回顾与计划</span></button>
            <button type="button" data-scene="default" onclick="selectScene('default')"><strong>自定义分析</strong><span>按所选资料分析</span></button>
          </div>
          <div class="scope-heading"><div><strong>分析资料</strong><span id="scopeHint" class="field-hint"></span></div><div class="scope-actions"><button id="resetScopeButton" class="btn-link" onclick="resetScope()">恢复推荐</button><button id="availableScopeButton" class="btn-link" onclick="selectAvailableTargets()">仅选可用</button><button id="clearTargetsButton" class="btn-link" onclick="selectAllTargets(false)">清空</button></div></div>
          <div id="targetTags" class="tag-grid" role="group" aria-label="分析资料"></div>
          <div class="focus-field"><label for="analysisFocus">本次关注点 <span>选填</span></label><textarea id="analysisFocus" rows="2" maxlength="2000" placeholder="例如：重点比较竞价强弱，列出盘中需要验证的信号。"></textarea></div>
          <div id="taskPanel" class="task-panel" role="status" aria-live="polite" hidden><strong id="taskProgressTitle">正在准备任务…</strong><div id="taskProgress" class="task-progress" role="progressbar" aria-label="任务进度" aria-valuemin="0" aria-valuemax="100"><span class="task-progress-fill"></span></div><div id="loadingText" class="loading-text"></div><div id="sidebarProgressBoard" class="top-progress-strip"></div></div>
          <div class="operation-bar"><div class="button-grid"><button class="btn-primary" id="primaryActionButton" onclick="runPrimaryAction()">开始分析</button><button class="btn-secondary" id="updateDataButton" onclick="fetchTargets('selected')">更新资料</button><button id="retryFailedButton" class="btn-ghost" onclick="retryFailedTargets()" hidden>重试失败项</button><button id="resumeTaskButton" class="btn-ghost" onclick="resumeActiveJob()" hidden>恢复任务查询</button></div><div class="operation-copy"><div id="workflowSummary">正在检查资料…</div><div id="statusText" class="status-text" role="status" aria-live="polite">等待操作</div></div></div>
        </section>
        <section class="card"><div class="card-head"><h2>分析结论</h2><div class="card-head-actions"><button class="btn-ghost btn-mini" id="copyAnalysisButton" onclick="copyAnalysisText()">复制文字</button><button class="btn-ghost btn-mini" onclick="copyAnalysisSnapshot()">复制图片</button></div></div>
          <div class="card-body"><div class="markdown-view" id="analysisContent"><div class="markdown-placeholder">选择场景后开始分析，或从右侧打开历史记录。</div></div></div><div id="analysisMeta" class="analysis-meta"></div>
        </section>
        <details class="details-panel"><summary>提示词与输入范围</summary><div class="card-head-actions"><button class="btn-ghost btn-mini" onclick="copyPrompt()">复制完整提示词</button></div><div id="promptPreview" class="prompt-preview is-empty">尚未生成 AI 提示词。</div><textarea id="promptEditor" hidden aria-hidden="true">尚未生成 AI 提示词。</textarea></details>
        <details class="details-panel"><summary>执行日志</summary><div class="text-view" id="jobLog">任务日志会显示在这里</div></details>
      </div>
      <aside class="support-column">
        <section class="card"><div class="card-head"><h2>资料状态</h2><div class="counts">可用 <span id="readyCount">0</span> / <span id="metricTargets">0</span></div></div><div id="targetData"><div class="empty">正在加载资料状态…</div></div></section>
        <section class="card"><div class="card-head"><h2>本日分析记录</h2><span id="currentDate" class="counts"></span></div><div id="historyList" class="history-list"><div class="empty">尚无分析记录</div></div></section>
      </aside>
    </main>
  </div>

  <script>
    const TARGETS = %TARGETS_JSON%;
    const DEFAULT_MODEL = "%DEFAULT_MODEL%";
    const STORAGE_KEYS = {
      selectedTargets: "astock.kanpan.selectedTargets.v1",
      scene: "astock.kanpan.scene.v1"
    };
    const TARGET_SHORT_LABELS = {
      jingjia: "竞价封单",
      jjyd: "竞价异动",
      global: "指数",
      ztlive: "涨停直播",
      yidong: "异动",
      pool: "涨停股池",
      amount: "成交额",
      fupan: "复盘",
      platerotat: "板块轮动",
      jinji: "连板晋级"
    };
    const QUICK_FLOWS = {
      open: {
        label: "开盘盘前解析",
        targets: ["jingjia", "jjyd"],
        preset: "open"
      },
      intraday: {
        label: "盘中预期解析",
        targets: ["jingjia", "jjyd", "jinji", "yidong"],
        preset: "intraday"
      },
      close: {
        label: "盘后复盘",
        targets: Object.keys(TARGETS),
        preset: "close"
      }
    };
    const STATUS_TEXT = {
      pending: "待执行",
      queued: "排队中",
      running: "抓取中",
      reading: "整理中",
      analyzing: "解析中",
      completed: "已完成",
      failed: "失败",
      skipped: "跳过"
    };
    const JOB_STATUS_TEXT = {
      running: "执行中",
      completed: "已完成",
      failed: "失败"
    };
    const SHORTLINE_QUOTES = [
      { text: "只有子弹在手，你才有主动权；开仓后盈亏就交给市场。", theme: "仓位", source: "2023-06-10《人性的弱点》" },
      { text: "只盯持仓、不看整体情绪，是短线最常见的误区。", theme: "情绪", source: "2023-06-10《人性的弱点》" },
      { text: "缩量行情里，后排套利最容易挡刀。", theme: "缩量", source: "2023-08-22 盘前计划" },
      { text: "板块没有持续性时，只参与龙头，不碰后排。", theme: "龙头", source: "2023-08-22 盘前计划" },
      { text: "龙头分歧低吸的前提，是板块还有持续性。", theme: "分歧", source: "2023-08-22 盘前总结" },
      { text: "开盘前 15 分钟先看量能，主线延续一定要放量。", theme: "量能", source: "2023-08-22 复盘" },
      { text: "预期是预期，行情是行情，别把预期打满。", theme: "预期", source: "2023-08-29 午评" },
      { text: "静下来阅读市场、理解市场、跟随市场。", theme: "跟随", source: "2023-08-29 午评" },
      { text: "好的买不到，买到的常常是坑。", theme: "交易", source: "2024-10-20 策略" },
      { text: "量能不够，轮动再热也很难走出主线。", theme: "主线", source: "2024-10-22 策略" },
      { text: "轻指数，重个股，但前提是情绪没有失控。", theme: "节奏", source: "2024-10-28 策略" },
      { text: "弱转强要看承接，不是只看高开。", theme: "承接", source: "2024-10-29 复盘" },
      { text: "流水不争先，争的是滔滔不绝。", theme: "耐心", source: "2026-03-09 思路前瞻" },
      { text: "大环境差就主动收缩仓位，轻仓试错等环境转好。", theme: "仓控", source: "2026-03-22 思路前瞻" },
      { text: "本金归零四招：冰点割肉、主升空仓、分歧接杂毛、退潮猛干。", theme: "警示", source: "2026-03-25 / 2026-04-01" },
      { text: "高开多数是坑，尤其是机构趋势高开。", theme: "高开", source: "2026-04-01《祖训难违》" },
      { text: "不接一致，不接后手连板，只吃先手轮动的一口。", theme: "一致", source: "2026-04-01 盘后前瞻" },
      { text: "药主升往往意味着避险，不等于适合接力强更强。", theme: "周期", source: "2026-04-01 盘后前瞻" },
      { text: "竞价不得不看，它决定很多超预期和不及预期的边界。", theme: "竞价", source: "2026-03-29 复盘" },
      { text: "要信早信，不信一天也别信，最怕半信半疑去接力。", theme: "执行", source: "2026-03-20-03-31 多篇复盘" }
    ];

    let state = {
      dates: [],
      currentDate: "",
      availableTargets: []
    };
    let settingsState = {
      kimiModel: DEFAULT_MODEL,
      hasKimiKey: false,
      kimiKeyMask: ""
    };
    let availableKimiModels = [];
    let modelConfigurationBusy = false;
    let settingsMutationVersion = 0;
    let currentScene = loadStoredScene();
    let selectedTargets = new Set(loadStoredTargets());
    let activeJobId = "";
    let activeJobDate = "";
    let jobPolling = false;
    let jobTimer = null;
    let lastPrompt = "";
    let lastAnalysis = "";
    let lastAnalyzeTargets = [];
    let lastPromptPreset = "default";
    let loadingVisible = false;
    let currentQuoteIndex = -1;
    let quoteTimer = null;
    let workspaceBusy = false;
    let failedTargets = [];
    let lastAnalysisContext = null;
    let lastAnalysisModel = "";
    let lastAnalysisPreset = "default";
    let stateRequestVersion = 0;
    let historyRequestVersion = 0;
    let stateLoading = true;

    function loadStoredScene() {
      try {
        const saved = localStorage.getItem(STORAGE_KEYS.scene);
        return saved === "default" || QUICK_FLOWS[saved] ? saved : "open";
      } catch { return "open"; }
    }

    function sceneLabel(scene = currentScene) {
      return QUICK_FLOWS[scene] ? QUICK_FLOWS[scene].label : "自定义分析";
    }

    function selectScene(scene, resetTargets = true) {
      if (workspaceBusy) return;
      currentScene = scene === "default" || QUICK_FLOWS[scene] ? scene : "default";
      try { localStorage.setItem(STORAGE_KEYS.scene, currentScene); } catch {}
      if (resetTargets && QUICK_FLOWS[currentScene]) applySelectedTargets(QUICK_FLOWS[currentScene].targets);
      else updateWorkspace();
    }

    function toggleSettings() {
      const panel = document.getElementById("settingsPanel");
      panel.open = !panel.open;
      if (panel.open) document.getElementById("kimiModel").focus();
    }

    function resetScope() {
      if (workspaceBusy) return;
      applySelectedTargets(QUICK_FLOWS[currentScene]?.targets || Object.keys(TARGETS));
    }

    function selectAvailableTargets() {
      if (workspaceBusy || !isDateReady()) return;
      applySelectedTargets(selectedData().filter(item => item.usable).map(item => item.target));
      setStatus("已保留所选范围内的可用资料；分析模板保持不变", true);
    }

    function canFetchTargets(targets) {
      const date = document.getElementById("tradeDate").value.trim();
      if (!date || !state.today) return Boolean(date);
      return date <= state.today && (date === state.today || targets.every(target => target === "jingjia"));
    }

    function selectedData() {
      return orderedTargetList(Array.from(selectedTargets)).map(target =>
        (state.targetData || []).find(item => item.target === target) ||
        { target, exists: state.availableTargets.includes(target) ? "true" : "false", usable: state.availableTargets.includes(target) }
      );
    }

    function isDateReady() {
      return !stateLoading && state.currentDate === document.getElementById("tradeDate").value.trim();
    }

    function setWorkspaceBusy(busy) {
      workspaceBusy = busy;
      ["tradeDate", "resetScopeButton", "availableScopeButton", "clearTargetsButton", "refreshStateButton", "analysisFocus"].forEach(id => {
        const node = document.getElementById(id);
        if (node) node.disabled = busy;
      });
      setModelConfigurationBusy(modelConfigurationBusy);
      document.querySelectorAll("[data-scene], #targetTags button, .dataset-actions button, .history-entry").forEach(node => { node.disabled = busy; });
      updateWorkspace(false);
    }

    function updateWorkspace(renderData = true) {
      const items = selectedData();
      const ready = items.filter(item => item.usable).length;
      const missing = items.filter(item => !item.usable).map(item => item.target);
      const defaults = QUICK_FLOWS[currentScene]?.targets;
      const adjusted = defaults && (defaults.length !== items.length || defaults.some(target => !selectedTargets.has(target)));
      document.querySelectorAll("[data-scene]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.scene === currentScene));
      });
      document.getElementById("scopeHint").textContent = `${items.length} 项已选 · ${ready} 项可用` + (defaults ? adjusted ? " · 已调整，保留场景模板" : " · 推荐范围" : " · 自选范围");
      document.getElementById("resetScopeButton").textContent = defaults ? "恢复推荐" : "选择全部";
      document.getElementById("availableScopeButton").disabled = workspaceBusy || !isDateReady() || !ready || ready === items.length;
      document.querySelectorAll("#targetTags button").forEach(button => {
        const item = (state.targetData || []).find(item => item.target === button.dataset.target);
        button.classList.toggle("is-ready", Boolean(item?.usable));
      });
      const primary = document.getElementById("primaryActionButton");
      primary.textContent = workspaceBusy ? "任务进行中…" : "开始分析";
      primary.disabled = workspaceBusy || modelConfigurationBusy || !isDateReady() || !items.length || !selectedKimiModel() || (missing.length > 0 && !canFetchTargets(missing));
      document.getElementById("updateDataButton").disabled = workspaceBusy || modelConfigurationBusy || !isDateReady() || !items.length || !canFetchTargets(items.map(x => x.target));
      const retry = document.getElementById("retryFailedButton");
      retry.hidden = !failedTargets.length;
      retry.disabled = workspaceBusy || modelConfigurationBusy || !isDateReady() || !canFetchTargets(failedTargets);
      document.getElementById("readyCount").textContent = String(ready);
      document.getElementById("workflowSummary").textContent = !isDateReady() ? "正在检查所选日期的资料…" : !items.length ? "请选择本次要分析的资料，可恢复推荐范围。" : !selectedKimiModel() ? "请在模型设置中选择或输入模型 ID。" : missing.length
        ? (canFetchTargets(missing) ? `开始后先更新 ${formatTargetLabels(missing, "、")}，再进行${sceneLabel()}。` : "所选日期无法补抓这些资料；请取消缺失项，或点击「仅选可用」分析已有归档。")
        : canFetchTargets(items.map(item => item.target)) ? `将使用 ${items.length} 项已有资料进行${sceneLabel()}；需要最新行情可先更新资料。`
        : `历史归档模式：使用 ${items.length} 项所选资料进行${sceneLabel()}，实时资料不支持补抓。`;
      document.getElementById("currentModelLabel").textContent = (selectedKimiModel() || "未选择模型") + (selectedKimiModel() && selectedKimiModel() !== settingsState.kimiModel ? "（仅本次）" : "");
      if (renderData) renderTargetData(items);
    }

    async function runPrimaryAction() {
      if (workspaceBusy || modelConfigurationBusy || !isDateReady()) return;
      const targets = orderedTargetList(Array.from(selectedTargets));
      if (!targets.length) { setStatus("请先选择资料"); return; }
      if (!selectedKimiModel()) { setStatus("请先选择或输入模型 ID"); document.getElementById("settingsPanel").open = true; return; }
      if (!currentKimiKeyValue() && !settingsState.hasKimiKey && !settingsState.hasEffectiveKimiKey) {
        setStatus("请先配置模型密钥；也可单独更新数据");
        document.getElementById("settingsPanel").open = true;
        document.getElementById("kimiKey").focus();
        return;
      }
      const missing = selectedData().filter(item => !item.usable).map(item => item.target);
      if (missing.length) {
        const fetched = await fetchTargets("single", missing, { generatePrompt: false, holdBusy: true });
        if (!fetched || fetched.status !== "completed") { if (!activeJobId) setWorkspaceBusy(false); return; }
      }
      await analyzeTargets("selected", "", { manualTargets: targets, continueWorkflow: missing.length > 0 });
    }

    async function retryFailedTargets() {
      if (workspaceBusy) return;
      await fetchTargets("single", [...failedTargets]);
    }

    function renderHistory(records = []) {
      const root = document.getElementById("historyList");
      root.replaceChildren();
      if (!records.length) { root.innerHTML = '<div class="empty">本日尚无分析记录</div>'; return; }
      records.forEach(record => {
        const button = document.createElement("button");
        button.className = "history-entry";
        button.disabled = workspaceBusy;
        const title = document.createElement("strong");
        title.textContent = `${sceneLabel(record.preset)} · ${record.context?.title_time || "时间未知"}`;
        const meta = document.createElement("span");
        meta.textContent = `${record.model || "旧版未记录模型"} · ${record.generated_at || "旧版归档"}`;
        button.append(title, meta);
        button.onclick = () => openAnalysisRecord(record.id).catch(err => setStatus(normalizeErrorMessage(err)));
        root.appendChild(button);
      });
    }

    function renderAnalysisMeta() {
      const node = document.getElementById("analysisMeta");
      if (!lastAnalysisContext) { node.textContent = ""; return; }
      node.textContent = `${sceneLabel(lastAnalysisPreset)} · ${lastAnalysisModel || "未记录模型"} · 分析时点 ${lastAnalysisContext.title_time}\n` +
        `资料采集 ${lastAnalysisContext.capture_start || "未知"} 至 ${lastAnalysisContext.capture_end || "未知"} · 生成 ${lastAnalysisContext.generated_at || "未知"}\n` +
        (lastAnalysisContext.time_note || "采集时间不等于源站行情截止时间。");
    }

    async function openAnalysisRecord(id) {
      if (workspaceBusy || !isDateReady()) return;
      const requestVersion = ++historyRequestVersion;
      const date = document.getElementById("tradeDate").value.trim();
      const response = await fetch(`/api/analysis?date=${encodeURIComponent(date)}&id=${encodeURIComponent(id)}`);
      const record = await response.json();
      if (!response.ok) throw new Error(record.error || "读取分析记录失败");
      if (workspaceBusy || requestVersion !== historyRequestVersion || date !== document.getElementById("tradeDate").value.trim()) return;
      selectScene(record.preset || "default", false);
      applySelectedTargets(record.targets || []);
      lastPromptPreset = record.preset || "default";
      lastAnalysisPreset = lastPromptPreset;
      lastAnalyzeTargets = record.targets || [];
      lastAnalysisContext = record.context || null;
      lastAnalysisModel = record.model || "";
      setPromptContent(record.prompt || "");
      setAnalysisContent(record.analysis || "");
      renderAnalysisMeta();
      setStatus("已打开历史记录", true);
    }

    async function copyAnalysisText() {
      if (!lastAnalysis.trim()) { setStatus("当前没有可复制的结论"); return; }
      try { await writeTextToClipboard(lastAnalysis); setStatus("分析正文已复制", true); }
      catch (err) { setStatus(normalizeErrorMessage(err)); }
    }

    function setStatus(text, ok = false, running = false) {
      const el = document.getElementById("statusText");
      el.textContent = text;
      el.title = text;
      el.className = "status-text" + (running ? " running" : ok ? " ok" : "");
      const statusText = running ? "运行中" : ok ? "完成" : "待处理";
      ["metricStatus", "metricStatusLegacy"].forEach((id) => {
        const node = document.getElementById(id);
        if (node) node.textContent = statusText;
      });
    }

    function setNodeText(selector, text) {

    function rotateSidebarQuote(forceIndex = null) {
      if (!SHORTLINE_QUOTES.length) return;
      let nextIndex = Number.isInteger(forceIndex) ? forceIndex : Math.floor(Math.random() * SHORTLINE_QUOTES.length);
      if (SHORTLINE_QUOTES.length > 1 && nextIndex === currentQuoteIndex) {
        nextIndex = (nextIndex + 1 + Math.floor(Math.random() * (SHORTLINE_QUOTES.length - 1))) % SHORTLINE_QUOTES.length;
      }
      currentQuoteIndex = nextIndex;
      const current = SHORTLINE_QUOTES[nextIndex];
      const quoteText = document.getElementById("sidebarQuoteText");
      quoteText.replaceChildren(...current.text.split(/(?<=[，；。！？、：])/u).filter(Boolean).map(text => {
        const phrase = document.createElement("span");
        phrase.className = "quote-phrase";
        phrase.textContent = text;
        return phrase;
      }));
      setNodeText("#sidebarQuoteMeta", `${current.theme} | ${current.source}`);
      scheduleQuoteRotation();
    }

      clearTimeout(quoteTimer);
      quoteTimer = null;

    function loadStoredTargets() {
      const defaults = QUICK_FLOWS[currentScene]?.targets || Object.keys(TARGETS);
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.selectedTargets);
        if (!raw) return defaults;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return defaults;
        const filtered = parsed.filter((item) => Object.prototype.hasOwnProperty.call(TARGETS, item));
        if (!parsed.length) return [];
        return filtered.length ? filtered : defaults;
      } catch {
        return defaults;
      }
    }

    function orderedTargetList(targets = []) {

    function summarizeTargets(targets = [], maxCount = 4) {

    function summarizeSelectionTargets(targets = [], maxCount = 4) {

    function jobProgressTitle(data = {}) {

      if (data.status === "failed") return "任务失败";

    function normalizeErrorMessage(err) {
      const text = String(err && err.message ? err.message : err || "")
        .replace(/^Error:\s*/i, "")
        .trim();
      return text || "发生未知错误";
    }

    function buildFailureAnalysis(errorText) {
      const message = normalizeErrorMessage(errorText);
      const hints = message.includes("HTTP 401") || /Invalid Authentication/i.test(message)
          ? [
              "- 当前是鉴权失败，不是数据缺失，也不是模型名问题",
              "- 请在顶部操作区先清空当前 Key，再粘贴新的有效 `Kimi API Key`",
              "- 点击“保存本机配置”后重新发起解析",
              "- 如果你本机还设置了 `MOONSHOT_API_KEY`，也请确认它不是旧 Key"
            ]
          : message.includes("Kimi API Key")
          ? [
              "- 在顶部操作区填写 `Kimi API Key` 后点击“保存本机配置”",
              "- 或在启动服务前设置环境变量 `MOONSHOT_API_KEY`",
              "- 保存后重新发起解析"
            ]
        : [
            "- 先确认所选标签数据已抓取完成",
            "- 再检查模型名和网络状态",
            "- 如仍失败，查看左下角执行日志中的最后几行"
          ];
      return [
        "# AI 解析失败",
        "",
        `> 原因：${message}`,
        "",
        "建议处理：",
        ...hints
      ].join("\n");
    }

    function splitTableRow(line) {
      return String(line || "")
        .trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split(/(?<!\\)\|/)
        .map((cell) => cell.replace(/\\\|/g, "|").trim());
    }

    function isTableDivider(line) {
      const cells = splitTableRow(line);
      return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
    }

    function parseMarkdownBlocks(markdown) {
      const lines = String(markdown || "").replace(/\r\n?/g, "\n").split("\n");
      const blocks = [];
      let paragraphLines = [];
      let quoteLines = [];
      let listItems = [];
      let listType = "";
      let codeLines = [];
      let tableLines = [];
      let inCode = false;

      function flushParagraph() {
        if (!paragraphLines.length) return;
        blocks.push({ type: "paragraph", text: paragraphLines.join("\n") });
        paragraphLines = [];
      }

      function flushQuote() {
        if (!quoteLines.length) return;
        blocks.push({ type: "quote", text: quoteLines.join("\n") });
        quoteLines = [];
      }

      function flushList() {
        if (!listItems.length) return;
        blocks.push({ type: "list", ordered: listType === "ordered", items: [...listItems] });
        listItems = [];
        listType = "";
      }

      function flushTable() {
        if (!tableLines.length) return;
        const headers = splitTableRow(tableLines[0]);
        const startIndex = tableLines.length > 1 && isTableDivider(tableLines[1]) ? 2 : 1;
        const rows = tableLines
          .slice(startIndex)
          .map((line) => splitTableRow(line))
          .filter((cells) => cells.length > 0 && cells.some((cell) => cell));
        if (headers.length) {
          blocks.push({ type: "table", headers, rows });
        }
        tableLines = [];
      }

      function flushAll() {
        flushParagraph();
        flushQuote();
        flushList();
        flushTable();
      }

      for (const rawLine of lines) {
        const line = rawLine.replace(/\t/g, "  ");
        const trimmed = line.trim();

        if (inCode) {
          if (trimmed.startsWith("```")) {
            blocks.push({ type: "code", text: codeLines.join("\n") });
            codeLines = [];
            inCode = false;
          } else {
            codeLines.push(rawLine);
          }
          continue;
        }

        if (trimmed.startsWith("```")) {
          flushAll();
          inCode = true;
          continue;
        }

        if (/^\s*\|.*\|\s*$/.test(line)) {
          flushParagraph();
          flushQuote();
          flushList();
          tableLines.push(trimmed);
          continue;
        }
        flushTable();

        if (!trimmed) {
          flushAll();
          continue;
        }

        if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
          flushAll();
          blocks.push({ type: "hr" });
          continue;
        }

        const headingMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
        if (headingMatch) {
          flushAll();
          blocks.push({
            type: "heading",
            level: Math.min(4, headingMatch[1].length),
            text: headingMatch[2].trim()
          });
          continue;
        }

        const quoteMatch = trimmed.match(/^>\s?(.*)$/);
        if (quoteMatch) {
          flushParagraph();
          flushList();
          quoteLines.push(quoteMatch[1]);
          continue;
        }
        flushQuote();

        const orderedMatch = trimmed.match(/^\d+\.\s+(.*)$/);
        if (orderedMatch) {
          flushParagraph();
          if (listType && listType !== "ordered") flushList();
          listType = "ordered";
          listItems.push(orderedMatch[1]);
          continue;
        }

        const unorderedMatch = trimmed.match(/^[-*+]\s+(.*)$/);
        if (unorderedMatch) {
          flushParagraph();
          if (listType && listType !== "unordered") flushList();
          listType = "unordered";
          listItems.push(unorderedMatch[1]);
          continue;
        }
        flushList();

        paragraphLines.push(trimmed);
      }

      flushAll();
      if (inCode && codeLines.length) {
        blocks.push({ type: "code", text: codeLines.join("\n") });
      }
      return blocks;
    }

    function renderInlineMarkdown(text) {
      const tokens = [];
      let html = escapeHtml(String(text || ""));
      html = html.replace(/`([^`]+)`/g, (_, code) => {
        const token = `@@CODETOKEN${tokens.length}@@`;
        tokens.push(`<code>${code}</code>`);
        return token;
      });
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      html = html.replace(/_([^_]+)_/g, "<em>$1</em>");
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) =>
        /^https?:\/\/[^\s"'<>]+$/i.test(url)
          ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
          : label);
      tokens.forEach((tokenHtml, index) => {
        html = html.split(`@@CODETOKEN${index}@@`).join(tokenHtml);
      });
      return html;
    }

    function renderMarkdown(markdown) {
      const blocks = parseMarkdownBlocks(markdown);
      if (!blocks.length) {
        return '<div class="markdown-placeholder">尚未生成 AI 解析结果。</div>';
      }
      return blocks.map((block) => {
        if (block.type === "heading") {
          const level = Math.min(4, Math.max(1, block.level || 1));
          return `<h${level}>${renderInlineMarkdown(block.text)}</h${level}>`;
        }
        if (block.type === "paragraph") {
          return `<p>${renderInlineMarkdown(block.text).replace(/\n/g, "<br />")}</p>`;
        }
        if (block.type === "quote") {
          return `<blockquote>${renderInlineMarkdown(block.text).replace(/\n/g, "<br />")}</blockquote>`;
        }
        if (block.type === "list") {
          const tag = block.ordered ? "ol" : "ul";
          const items = block.items.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("");
          return `<${tag}>${items}</${tag}>`;
        }
        if (block.type === "code") {
          return `<pre><code>${escapeHtml(block.text)}</code></pre>`;
        }
        if (block.type === "table") {
          const head = `<thead><tr>${block.headers.map((cell) => `<th>${renderInlineMarkdown(cell)}</th>`).join("")}</tr></thead>`;
          const bodyRows = block.rows.length
            ? block.rows.map((row) => `<tr>${row.map((cell) => `<td>${renderInlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")
            : `<tr>${block.headers.map(() => "<td>-</td>").join("")}</tr>`;
          return `<table>${head}<tbody>${bodyRows}</tbody></table>`;
        }
        return "<hr />";
      }).join("");
    }

    function plainMarkdownText(text) {
      return String(text || "")
        .replace(/!\[[^\]]*\]\([^)]+\)/g, "")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/\*\*([^*]+)\*\*/g, "$1")
        .replace(/__([^_]+)__/g, "$1")
        .replace(/\*([^*]+)\*/g, "$1")
        .replace(/_([^_]+)_/g, "$1")
        .trim();
    }

    function wrapCanvasText(ctx, text, maxWidth) {
      const paragraphs = String(text || "").split("\n");
      const lines = [];
      paragraphs.forEach((paragraph) => {
        if (!paragraph) {
          lines.push("");
          return;
        }
        let current = "";
        for (const char of paragraph) {
          const candidate = current + char;
          if (current && ctx.measureText(candidate).width > maxWidth) {
            lines.push(current);
            current = char;
          } else {
            current = candidate;
          }
        }
        if (current) lines.push(current);
      });
      return lines.length ? lines : [""];
    }

    function roundedRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function snapshotSegments(markdown) {
      const blocks = parseMarkdownBlocks(markdown);
      const segments = [];
      blocks.forEach((block) => {
        if (block.type === "heading") {
          segments.push({ type: `h${Math.min(4, Math.max(1, block.level || 1))}`, text: plainMarkdownText(block.text) });
          return;
        }
        if (block.type === "paragraph") {
          segments.push({ type: "body", text: plainMarkdownText(block.text) });
          return;
        }
        if (block.type === "quote") {
          segments.push({ type: "quote", text: plainMarkdownText(block.text) });
          return;
        }
        if (block.type === "list") {
          block.items.forEach((item, index) => {
            const prefix = block.ordered ? `${index + 1}. ` : "• ";
            segments.push({ type: "list", text: prefix + plainMarkdownText(item) });
          });
          return;
        }
        if (block.type === "code") {
          segments.push({ type: "code", text: block.text.trim() });
          return;
        }
        if (block.type === "table") {
          const rows = [
            block.headers.join(" ｜ "),
            ...block.rows.map((row) => row.join(" ｜ "))
          ].join("\n");
          segments.push({ type: "table", text: rows });
          return;
        }
        segments.push({ type: "divider", text: "" });
      });
      return segments;
    }

    function padSnapshotNumber(value) {
      return String(value).padStart(2, "0");
    }

    function snapshotTitleDateParts() {
      const tradeDate = document.getElementById("tradeDate").value.trim() || state.currentDate || "";
      const match = tradeDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (match) {
        return {
          year: match[1],
          month: match[2],
          day: match[3]
        };
      }
      const now = new Date();
      return {
        year: String(now.getFullYear()),
        month: padSnapshotNumber(now.getMonth() + 1),
        day: padSnapshotNumber(now.getDate())
      };
    }

    function buildAnalysisSnapshotTitle() {
      const { month, day } = snapshotTitleDateParts();
      const monthDay = `${month}-${day}`;
      const preset = (lastAnalysisPreset || "default").trim().toLowerCase();
      if (lastAnalysisContext?.title_time) {
        const title = `${sceneLabel(preset)} ${lastAnalysisContext.title_time}`;
        return { title, filename: `ai-${preset}-${lastAnalysisContext.title_time.replaceAll(/[^0-9a-z-]/gi, "-")}` };
      }

      if (preset === "open") {
        return {
          title: `AI竞价解析 ${monthDay} 09:25`,
          filename: `ai-jingjia-${monthDay}-09-25`
        };
      }

      if (preset === "intraday") {
        return {
          title: `AI盘中解析 ${monthDay} 时间未知`,
          filename: `ai-intraday-${monthDay}`
        };
      }

      if (preset === "close") {
        return {
          title: `全量复盘 ${monthDay} 15:00`,
          filename: `full-review-${monthDay}-15-00`
        };
      }

      return {
        title: `AI复盘解析 ${monthDay}`,
        filename: `ai-analysis-${monthDay}`
      };
    }

    function createAnalysisSnapshotCanvas(markdown) {
      const segments = snapshotSegments(markdown);
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const width = 1280;
      const padding = 58;
      const contentWidth = width - padding * 2;
      const snapshotTitle = buildAnalysisSnapshotTitle();
      const metaText = [
        state.currentDate ? `交易日 ${state.currentDate}` : "",
        lastAnalyzeTargets.length ? formatTargetLabels(lastAnalyzeTargets, " / ") : ""
      ].filter(Boolean).join("    ");

      const palette = {
        title: "#f6fbff",
        subtitle: "#8fa2ba",
        body: "#dce7f5",
        accent: "#ffd6ce",
        accentStrong: "#ff735e",
        quote: "#a8d7e9",
        border: "rgba(122, 148, 182, 0.24)",
        panel: "#0a1420",
        panel2: "#0e1928",
        code: "#08121d"
      };

      function render(draw) {
        let y = padding;

        ctx.font = "700 42px Microsoft YaHei UI";
        if (draw) {
          ctx.fillStyle = "rgba(0, 0, 0, 0)";
          ctx.fillText("AI 复盘解析", padding, y);
          ctx.fillStyle = palette.title;
          ctx.fillText(snapshotTitle.title, padding, y);
        }
        y += 56;

        if (metaText) {
          ctx.font = "16px Microsoft YaHei UI";
          if (draw) {
            ctx.fillStyle = palette.subtitle;
            ctx.fillText(metaText, padding, y);
          }
          y += 34;
        }

        if (draw) {
          ctx.strokeStyle = palette.border;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(padding, y);
          ctx.lineTo(width - padding, y);
          ctx.stroke();
        }
        y += 28;

        for (const segment of segments) {
          if (segment.type === "divider") {
            if (draw) {
              ctx.strokeStyle = palette.border;
              ctx.beginPath();
              ctx.moveTo(padding, y);
              ctx.lineTo(width - padding, y);
              ctx.stroke();
            }
            y += 24;
            continue;
          }

          let font = "18px Microsoft YaHei UI";
          let color = palette.body;
          let lineHeight = 34;
          let blockPaddingY = 0;
          let background = "";
          let leftBar = "";
          let offsetX = padding;
          let maxWidth = contentWidth;

          if (segment.type === "h1") {
            font = "700 34px Microsoft YaHei UI";
            color = palette.title;
            lineHeight = 48;
          } else if (segment.type === "h2") {
            font = "700 28px Microsoft YaHei UI";
            color = palette.accentStrong;
            lineHeight = 40;
          } else if (segment.type === "h3") {
            font = "700 23px Microsoft YaHei UI";
            color = palette.accent;
            lineHeight = 34;
          } else if (segment.type === "h4") {
            font = "700 20px Microsoft YaHei UI";
            color = "#92e0ff";
            lineHeight = 30;
          } else if (segment.type === "quote") {
            font = "18px Microsoft YaHei UI";
            color = palette.quote;
            lineHeight = 32;
            blockPaddingY = 14;
            background = "rgba(35, 160, 200, 0.10)";
            leftBar = "rgba(35, 160, 200, 0.72)";
            offsetX = padding + 18;
            maxWidth = contentWidth - 24;
          } else if (segment.type === "code" || segment.type === "table") {
            font = "16px Consolas";
            color = "#d4e4ff";
            lineHeight = 28;
            blockPaddingY = 16;
            background = "rgba(4, 10, 18, 0.92)";
            offsetX = padding + 16;
            maxWidth = contentWidth - 32;
          }

          ctx.font = font;
          const lines = wrapCanvasText(ctx, segment.text, maxWidth);
          const blockHeight = lines.length * lineHeight + blockPaddingY * 2;

          if (draw && background) {
            ctx.save();
            roundedRect(ctx, padding, y - 8, contentWidth, blockHeight + 16, 18);
            ctx.fillStyle = background;
            ctx.fill();
            ctx.restore();
          }

          if (draw && leftBar) {
            ctx.save();
            roundedRect(ctx, padding, y - 8, 4, blockHeight + 16, 4);
            ctx.fillStyle = leftBar;
            ctx.fill();
            ctx.restore();
          }

          if (draw) {
            ctx.font = font;
            ctx.fillStyle = color;
          }

          let textY = y + blockPaddingY + lineHeight * 0.82;
          lines.forEach((line) => {
            if (draw && line) {
              ctx.fillText(line, offsetX, textY);
            }
            textY += lineHeight;
          });
          y += blockHeight + 20;
        }

        return y + padding - 20;
      }

      canvas.width = width;
      canvas.height = Math.max(760, Math.ceil(render(false)));

      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, palette.panel);
      gradient.addColorStop(1, palette.panel2);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      roundedRect(ctx, 16, 16, canvas.width - 32, canvas.height - 32, 28);
      ctx.strokeStyle = "rgba(122, 148, 182, 0.28)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      render(true);
      return canvas;
    }

    async function copyAnalysisSnapshot() {
      if (!lastAnalysis.trim()) {
        setStatus("当前没有可复制的解析结果");
        return;
      }
      try {
        const snapshotTitle = buildAnalysisSnapshotTitle();
        const canvas = createAnalysisSnapshotCanvas(lastAnalysis);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("生成截图失败");

        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          setStatus("解析截图已复制", true);
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${snapshotTitle.filename}.png`;
        link.click();
        setStatus("浏览器不支持直接复制，已触发下载", true);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        setStatus(normalizeErrorMessage(err));
      }
    }

    function showLoading(text) {
      loadingVisible = true;
      renderTaskProgress("running", text);
    }

    function updateLoading(text) {
      if (!loadingVisible) return;
      renderTaskProgress("running", text);
    }

    function hideLoading() {
      loadingVisible = false;
      const panel = document.getElementById("taskPanel");
      if (panel.dataset.state === "running") panel.hidden = true;
    }

    function renderTaskProgress(status, text) {
      const panel = document.getElementById("taskPanel");
      const bar = document.getElementById("taskProgress");
      const [title, ...details] = (text || "正在执行任务…").split("\n");
      panel.dataset.state = status;
      panel.hidden = false;
      document.getElementById("taskProgressTitle").textContent = title;
      document.getElementById("loadingText").textContent = details.join("\n");
      bar.setAttribute("aria-valuetext", title);
      if (status === "completed") bar.setAttribute("aria-valuenow", "100");
      else bar.removeAttribute("aria-valuenow");
    }

    function finishTaskProgress(status, text) {
      loadingVisible = false;
      renderTaskProgress(status, text);
    }

    function selectedTargetList(mode) {
      if (mode === "all") return Object.keys(TARGETS);
      return orderedTargetList(Array.from(selectedTargets));
    }

    function updateMetrics() {
      const availableCount = Array.isArray(state.availableTargets) ? state.availableTargets.length : 0;
      const selected = orderedTargetList(Array.from(selectedTargets));
      const currentDateText = state.currentDate || "-";
      setTextByIds(["metricDate", "metricDateLegacy"], currentDateText);
      setTextByIds(["metricAvailable", "metricAvailableLegacy"], String(availableCount));
      setTextByIds(["metricTargets", "metricTargetsLegacy"], String(selectedTargets.size));
      document.getElementById("currentDate").textContent = currentDateText;
      const summary = document.getElementById("selectionSummary");
      if (summary) {
        const chips = [];
        chips.push(`<div class="toolbar-chip ${selected.length ? "" : "warn"}">${selected.length ? `已选 ${selected.length} 个标签` : "未选择标签"}</div>`);
        if (selected.length) {
          chips.push(`<div class="toolbar-chip accent">${escapeHtml(summarizeSelectionTargets(selected, 3))}</div>`);
        }
        chips.push(`<div class="toolbar-chip">已有数据 ${availableCount} 项</div>`);
        if (chips.length) {
          chips[0] = `<div class="toolbar-chip ${selected.length ? "" : "warn"}">${selected.length ? `已选 ${selected.length}` : "未选标签"}</div>`;
          chips[chips.length - 1] = `<div class="toolbar-chip">已抓 ${availableCount}</div>`;
        }
        summary.innerHTML = chips.join("");
      }
      updateWorkspace();

    function renderTags() {
      const root = document.getElementById("targetTags");
      root.innerHTML = "";
      Object.entries(TARGETS).forEach(([key, meta]) => {
        const tag = document.createElement("button");
        tag.type = "button";
        tag.dataset.target = key;
        tag.disabled = workspaceBusy;
        tag.setAttribute("aria-pressed", String(selectedTargets.has(key)));
        tag.className = "tag" + (selectedTargets.has(key) ? " active" : "");
        tag.textContent = targetLabel(key);
        tag.title = targetFullLabel(key);
        tag.onclick = () => {
          if (workspaceBusy) return;
          if (selectedTargets.has(key)) {
            selectedTargets.delete(key);
          } else {
            selectedTargets.add(key);
          }
          persistSelectedTargets();
          renderTags();
          renderProgress();
          updateMetrics();
        };
        root.appendChild(tag);
      });

    function renderProgress(statuses = null) {
      const roots = ["sidebarProgressBoard", "topProgressBoard"]
        .map((id) => document.getElementById(id))
        .filter(Boolean);
      if (!roots.length) return;
      roots.forEach((root) => { root.innerHTML = ""; });
      const keys = Object.keys(TARGETS).filter((key) => selectedTargets.has(key));
      if (!keys.length) {
        const emptyState = '<div class="top-progress-item status-pending"><div class="top-progress-name">未选标签</div><div class="pill pending">待命</div></div>';
        roots.forEach((root) => { root.innerHTML = emptyState; });
        return;
      }
      keys.forEach((key) => {
        const raw = statuses && statuses[key] ? statuses[key] : "pending";
        roots.forEach((root) => {
          const topItem = document.createElement("div");
          topItem.className = "top-progress-item status-" + raw;
          const topName = document.createElement("div");
          topName.className = "top-progress-name";
          topName.textContent = targetLabel(key);
          topName.title = targetFullLabel(key);
          const topPill = document.createElement("div");
          topPill.className = "pill " + raw;
          topPill.textContent = STATUS_TEXT[raw] || raw;
          topItem.appendChild(topName);
          topItem.appendChild(topPill);
          root.appendChild(topItem);
        });
      });
    }

    function selectAllTargets(enabled) {
      if (workspaceBusy) return;
      applySelectedTargets(enabled ? Object.keys(TARGETS) : []);
    }

    function renderTargetData(items) {
      const root = document.getElementById("targetData");
      const expanded = new Set(root.querySelectorAll ? Array.from(root.querySelectorAll(".dataset[data-dataset]"))
        .filter(node => node.querySelector("details")?.open).map(node => node.dataset.dataset) : []);
      if (!items || !items.length) {
        root.innerHTML = '<div class="empty">请选择本次分析需要的资料。</div>';
        return;
      }
      root.innerHTML = items.map((item) => {
        const exists = item.exists === "true";
        const failed = item.fetch_status === "failed" || item.quality === "failed";
        const shortLabel = item.target ? targetLabel(item.target) : item.label;
        const fullLabel = item.target ? targetFullLabel(item.target) : item.label;
        const body = failed ? (exists ? "本次抓取失败，已保留原数据，请重新抓取" : "本次抓取失败，请查看执行日志") : item.quality_message || (exists ? "已有归档" : "尚未抓取");
        const labels = { ready: "可用", read_error: "读取失败", invalid_time: "时间异常", unknown: "时间未知", stale: "待更新", wrong_date: "日期不符", empty: "空数据", missing: "缺失", updating: "更新中" };
        const meta = failed ? "本次抓取失败" : labels[item.quality] || (exists ? "已有归档" : "待抓取");
        const metaClass = failed ? "dataset-meta failed" : item.usable ? "dataset-meta ok" : "dataset-meta pending";
        return `
          <section class="dataset" data-dataset="${escapeHtml(item.target || "")}">
            <div class="dataset-head">
              <div class="dataset-title" title="${escapeHtml(fullLabel)}">${escapeHtml(shortLabel)}</div>
              <div class="${metaClass}">${escapeHtml(meta)}</div>
            </div>
            <div class="dataset-body">${escapeHtml(body)}</div>
            <div class="dataset-time">数据日期 ${escapeHtml(item.data_date || "未知")}<br>采集 ${escapeHtml(item.captured_at || "时间未知")}${item.row_count == null ? "" : ` · ${Number(item.row_count)} 条`}</div>
            ${item.content ? `<details class="raw-data"${expanded.has(item.target) ? " open" : ""}><summary>查看原始资料</summary><pre>${escapeHtml(item.content)}</pre></details>` : ""}
            ${item.target ? `<div class="dataset-actions"><button type="button" data-target="${escapeHtml(item.target)}">更新此项</button></div>` : ""}
          </section>
        `;
      }).join("");
      if (root.querySelectorAll) root.querySelectorAll("[data-target]").forEach(button => {
        const target = button.dataset.target;
        button.disabled = workspaceBusy || modelConfigurationBusy || !isDateReady() || !canFetchTargets([target]);
        button.onclick = () => fetchTargets("single", [target]);
      });
    }

    }

    function currentKimiKeyValue() {
      const raw = currentDisplayedKimiKey();
      if (!raw) return "";
      if (settingsState.hasKimiKey && raw === settingsState.kimiKeyMask) {
        return "";
      }

      const select = document.getElementById("kimiModelOptions");

    function setModelFeedback(text, status = "") {
      const node = document.getElementById("modelConfigFeedback");
      node.textContent = text;
      node.className = "field-hint model-feedback" + (status ? " " + status : "");
    }

    function setModelConfigurationBusy(busy) {
      modelConfigurationBusy = busy;
      ["fetchModelsButton", "testModelButton", "saveSettingsButton", "clearKeyButton", "kimiKey", "kimiModel", "kimiModelOptions"].forEach((id) => {
        document.getElementById(id).disabled = busy || (typeof workspaceBusy !== "undefined" && workspaceBusy);
      });
      if (typeof updateWorkspace === "function") updateWorkspace(false);
    }

    async function fetchKimiModels() {
      if (modelConfigurationBusy) return;
      setModelConfigurationBusy(true);
      setModelFeedback("正在获取模型列表…", "running");
      try {
        const selectedModel = selectedKimiModel();
        const data = await postJson("/api/models", { api_key: currentKimiKeyValue() });
        if (!Array.isArray(data.models) || !data.models.length || data.models.some((id) => typeof id !== "string" || !id.trim())) {
          throw new Error("服务未返回有效的模型列表");
        }
        availableKimiModels = Array.from(new Set(data.models.map((id) => id.trim())));
        renderModelOptions(selectedModel);
        const hint = availableKimiModels.includes(selectedModel) ? "请选择后测试或保存。" : "当前模型未在列表中，可选择其他模型或先测试。";
        setModelFeedback(`已获取 ${availableKimiModels.length} 个模型。${hint}`, "ok");
      } catch (err) {
        setModelFeedback("获取失败：" + normalizeErrorMessage(err), "error");
      } finally {
        setModelConfigurationBusy(false);
      }
    }

    async function testSelectedModel() {
      if (modelConfigurationBusy) return;
      const model = selectedKimiModel();
      if (!model) { setModelFeedback("请先选择或输入模型 ID。", "error"); return; }
      setModelConfigurationBusy(true);
      setModelFeedback(`正在测试 ${model}，请稍候…`, "running");
      try {
        const data = await postJson("/api/model-test", { api_key: currentKimiKeyValue(), model });
        if (data.ok !== true || data.model !== model || typeof data.reply !== "string" || !data.reply.trim() || !Number.isFinite(data.elapsed_ms) || data.elapsed_ms < 0) {
          throw new Error("模型测试未返回有效的成功结果");
        }
        const seconds = (Number(data.elapsed_ms) / 1000).toFixed(2);
        setModelFeedback(`测试通过：${data.model}\n耗时 ${seconds} 秒，回复：${data.reply.slice(0, 120)}`, "ok");
      } catch (err) {
        setModelFeedback(`测试失败：${model}\n` + normalizeErrorMessage(err), "error");
      } finally {
        setModelConfigurationBusy(false);
      }
    }

    function resetModelsForKeyInput() {
      availableKimiModels = [];
      renderModelOptions();
      setModelFeedback("密钥输入已变化，可重新获取模型列表。获取和测试不会保存配置。");
    }

    function buildSettingsPayload(preserveExistingBlank = false) {
      const raw = currentDisplayedKimiKey();
      const keepExistingKey = settingsState.hasKimiKey && (
        raw === settingsState.kimiKeyMask || (preserveExistingBlank && !raw)
      );
      return {
        kimi_key: keepExistingKey ? "" : raw,
        kimi_model: selectedKimiModel(),
        keep_existing_key: keepExistingKey
      };
    }

    function applySettings(settings = {}) {
      const keyInput = document.getElementById("kimiKey");
      const currentModel = selectedKimiModel();
      const modelWasChanged = currentModel !== settingsState.kimiModel;
      const previousMask = settingsState.kimiKeyMask || "";
      const currentValue = keyInput.value.trim();
      settingsState = {
        kimiModel: settings.kimiModel || DEFAULT_MODEL,
        hasKimiKey: Boolean(settings.hasKimiKey),
        hasEffectiveKimiKey: Boolean(settings.hasEffectiveKimiKey),
        kimiKeyMask: settings.kimiKeyMask || ""
      };
      renderModelOptions(modelWasChanged ? currentModel : settingsState.kimiModel);
      document.getElementById("kimiKeyHint").textContent = settingsState.hasKimiKey
        ? "已保存 · " + settingsState.kimiKeyMask + " · 留空即可使用"
        : settingsState.hasEffectiveKimiKey ? "已配置环境变量密钥 · 留空即可使用" : "尚未配置密钥，请粘贴后测试并保存。";
      if (currentValue === previousMask) keyInput.value = "";
      keyInput.placeholder = settingsState.hasKimiKey || settingsState.hasEffectiveKimiKey
        ? "沿用已保存密钥；需要更换时粘贴新密钥" : "粘贴 Kimi API 密钥";
      if (typeof updateWorkspace === "function") updateWorkspace(false);
    }

    async function loadSettings() {
      const version = settingsMutationVersion;
      const res = await fetch("/api/settings");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "加载配置失败");
      if (version === settingsMutationVersion) applySettings(data);
    }

    async function saveCurrentSettings() {
      const payload = buildSettingsPayload(true);
      const version = ++settingsMutationVersion;
      const data = await postJson("/api/settings", payload);
      if (data.ok !== true || data.kimiModel !== payload.kimi_model || typeof data.hasKimiKey !== "boolean" || typeof data.kimiKeyMask !== "string") {
        throw new Error("服务未确认配置保存成功");
      }
      if (version === settingsMutationVersion) {
        applySettings(data);
        const keyInput = document.getElementById("kimiKey");
        if (payload.kimi_key && keyInput.value.trim() === payload.kimi_key) {
          keyInput.value = "";
        }
      }
      return data;
    }

    async function saveSettings() {
      if (modelConfigurationBusy) return;
      if (!selectedKimiModel()) { setModelFeedback("请先选择或输入模型 ID。", "error"); return; }
      setModelConfigurationBusy(true);
      try {
        const data = await saveCurrentSettings();
        setModelFeedback("已保存选定模型：" + data.kimiModel, "ok");
        setStatus("本机配置已保存", true);
      } catch (err) {
        setModelFeedback("保存失败：" + normalizeErrorMessage(err), "error");
        setStatus(normalizeErrorMessage(err));
      } finally {
        setModelConfigurationBusy(false);
      }
    }

    function clearKeyInput() {
      document.getElementById("kimiKey").value = "";
      resetModelsForKeyInput();
      setStatus("已清空当前输入", true);
    }

    async function refreshState(dateOverride = "") {
      const requestVersion = ++stateRequestVersion;
      stateLoading = true;
      updateWorkspace(false);
      try {
        const settingsVersion = settingsMutationVersion;
        const requestedDate = dateOverride || document.getElementById("tradeDate").value.trim();
        const qs = requestedDate ? "?date=" + encodeURIComponent(requestedDate) : "";
        const res = await fetch("/api/state" + qs);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "加载状态失败");
        if (requestVersion !== stateRequestVersion) return;
        const dateChanged = state.currentDate && state.currentDate !== data.currentDate;
        state = data;
        document.getElementById("tradeDate").value = state.currentDate;
        if (dateChanged && !activeJobId) {
          document.getElementById("taskPanel").hidden = true;
          document.getElementById("analysisFocus").value = "";
          setPromptContent("");
          setAnalysisContent("");
          lastAnalyzeTargets = [];
          lastPromptPreset = currentScene;
          lastAnalysisContext = null;
          lastAnalysisModel = "";
          lastAnalysisPreset = "default";
          historyRequestVersion++;
          failedTargets = [];
          renderAnalysisMeta();
          renderProgress();
        }
        if (state.settings && settingsVersion === settingsMutationVersion) applySettings(state.settings);
        const dates = document.getElementById("archiveDates");
        dates.replaceChildren(...(state.dates || []).map(date => {
          const option = document.createElement("option");
          option.value = date;
          return option;
        }));
        renderHistory(state.history || []);
        if (!activeJobId && !workspaceBusy) setStatus("状态已刷新", true);
        updateMetrics();
      } finally {
        if (requestVersion === stateRequestVersion) {
          stateLoading = false;
          updateWorkspace();
        }
      }
    }

    async function postJson(url, payload) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "请求失败");
      return data;
    }

    async function generatePromptForTargets(date, targets, options = {}) {
      const data = await postJson("/api/prompt", {
        date,
        targets,
        preset: options.preset || currentScene
      });
      lastAnalyzeTargets = [...targets];
      lastPromptPreset = data.preset || options.preset || currentScene;
      setPromptContent(data.prompt || "");
      if (options.updateTargetData !== false && data.target_data) {
        renderTargetData(data.target_data);
      }
      return data;
    }

    async function fetchTargets(mode, manualTargets = [], options = {}) {
      if (workspaceBusy || modelConfigurationBusy || !isDateReady()) return null;
      const date = document.getElementById("tradeDate").value.trim();
      const targets = manualTargets.length ? manualTargets : selectedTargetList(mode);
      if (!targets.length) {
        setStatus("请先选择抓取目标");
        return null;
      }
      if (!canFetchTargets(targets)) { setStatus("历史归档模式：所选模块不支持补抓该日期，请选择已有资料"); return null; }
      setWorkspaceBusy(true);
      let handoff = false;
      const targetText = formatTargetLabels(targets);
      showLoading("正在提交抓取请求...\n" + targetText);
      setStatus("正在抓取：" + formatTargetLabels(targets, "、"), false, true);
      document.getElementById("jobLog").textContent = "任务已提交，等待日志...";
      renderProgress(Object.fromEntries(targets.map((item) => [item, "queued"])));
      try {
        const data = await postJson("/api/fetch", { date, targets });
        updateLoading("抓取任务已提交，等待服务返回日志...\n" + targetText);
        const finalData = await followJob(data.job_id, date);
        if (finalData && finalData.status === "completed" && options.generatePrompt !== false) {
          try {
            await generatePromptForTargets(date, targets, {
              preset: options.promptPreset || currentScene,
              updateTargetData: false
            });
            setStatus("抓取完成，提示词已生成", true);
          } catch (err) {
            setStatus("抓取完成，但提示词生成失败：" + normalizeErrorMessage(err));
          }
        }
        handoff = Boolean(options.holdBusy && finalData?.status === "completed");
        return finalData;
      } catch (err) {
        hideLoading();
        const message = normalizeErrorMessage(err);
        setStatus(message);
        failedTargets = [...targets];
        finishTaskProgress("failed", "资料更新失败\n" + message);
        return null;
      } finally {
        if (!handoff && !activeJobId) { hideLoading(); setWorkspaceBusy(false); }
      }
    }

    async function analyzeTargets(mode, promptOverride = "", options = {}) {
      if ((workspaceBusy && !options.continueWorkflow) || modelConfigurationBusy || !isDateReady()) return null;
      const date = document.getElementById("tradeDate").value.trim();
      let targets = options.manualTargets && options.manualTargets.length
        ? orderedTargetList(options.manualTargets)
        : selectedTargetList(mode);
      if (mode === "all" && !(options.manualTargets && options.manualTargets.length)) {
        targets = Object.keys(TARGETS);
      }
      if (!targets.length) {
        setStatus("请先选择解析目标");
        return null;
      }
      const targetText = formatTargetLabels(targets);
      setWorkspaceBusy(true);
      try {
        showLoading("正在提交 AI 解析请求...\n" + targetText);
        setStatus("Kimi 解析中：" + formatTargetLabels(targets, "、"), false, true);
        document.getElementById("jobLog").textContent = "任务已提交，等待日志...";
        renderProgress(Object.fromEntries(targets.map((item) => [item, "queued"])));
        const focus = document.getElementById("analysisFocus").value.trim();
        if (!promptOverride && focus) {
          const prepared = await generatePromptForTargets(date, targets, { preset: options.preset || currentScene, updateTargetData: false });
          if (!prepared.prompt?.trim()) throw new Error("未生成有效的分析输入，请刷新资料后重试");
          promptOverride = prepared.prompt + "\n\n## 本次补充关注点\n在遵守上述场景规则与证据要求的前提下，补充关注：\n" + focus;
        }
        const data = await postJson("/api/analyze", {
          date,
          targets,
          api_key: currentKimiKeyValue(),
          model: selectedKimiModel(),
          prompt_override: promptOverride,
          preset: options.preset || currentScene
        });
        updateLoading("AI 解析任务已提交，正在等待阶段更新...\n" + targetText);
        return await followJob(data.job_id, date);
      } catch (err) {
        hideLoading();
        const message = normalizeErrorMessage(err);
        setStatus(message);
        document.getElementById("jobLog").textContent = "任务未启动。\n" + message;
        finishTaskProgress("failed", "分析未启动\n" + message);
        renderProgress();
        return null;
      } finally {
        if (!activeJobId) { hideLoading(); setWorkspaceBusy(false); }
      }
    }

    async function reanalyzeWithEditedPrompt() {
      const prompt = document.getElementById("promptEditor").value.trim();
      if (!prompt || prompt === "尚未生成 AI 提示词。") {
        setStatus("当前没有可重发的提示词");
        return;
      }
      const targets = lastAnalyzeTargets.length ? lastAnalyzeTargets : Array.from(selectedTargets);
      if (!targets.length) {
        setStatus("请先选择解析目标");
        return;
      }
      await analyzeTargets("selected", prompt, {
        manualTargets: targets,
        preset: lastPromptPreset || "default"
      });
    }

    async function runQuickFlow(flowKey) {
      const flow = QUICK_FLOWS[flowKey];
      if (!flow) {
        setStatus("未识别的快捷工作流");
        return;
      }
      selectScene(flowKey);
      await runPrimaryAction();
    }

    async function followJob(jobId, date) {
      activeJobId = jobId;
      activeJobDate = date;
      jobPolling = true;
      document.getElementById("resumeTaskButton").hidden = true;
      if (jobTimer) clearTimeout(jobTimer);
      let queryFailures = 0;
      try {
        while (true) {
          let data;
          try {
            const res = await fetch("/api/job?id=" + encodeURIComponent(jobId));
            data = await res.json();
            if (res.status === 404) {
              data = { status: "failed", error: "任务记录已不存在，可能服务已重启。请先检查本日分析记录。" };
            } else if (!res.ok) throw new Error(data.error || "任务查询失败");
            if (!["running", "pending", "queued", "completed", "failed"].includes(data.status)) {
              throw new Error("任务状态响应无效");
            }
            queryFailures = 0;
          } catch (err) {
            queryFailures += 1;
            if (queryFailures >= 3) {
              finishTaskProgress("paused", "任务查询中断\n后台可能仍在执行，请点击「恢复任务查询」继续查看进度。");
              document.getElementById("resumeTaskButton").hidden = false;
              setStatus("任务查询中断，后台可能仍在执行；请恢复任务查询，避免重复提交。" + normalizeErrorMessage(err));
              return { status: "unknown" };
            }
            setStatus("任务查询暂时失败，正在重查原任务…", false, true);
            updateLoading("正在重新查询任务状态…\n保留原任务，不会重复提交分析。");
            await new Promise(resolve => { jobTimer = setTimeout(resolve, 1000); });
            continue;
          }

          document.getElementById("jobLog").textContent = (data.logs || []).join("\n");
          renderProgress(data.target_statuses || {});
          const phaseText = jobProgressTitle(data);
          updateLoading([phaseText, buildLoadingDetail(data)].filter(Boolean).join("\n"));
          setStatus(
            buildStatusSummary(data) + " / " + formatJobStatus(data.status),
            data.status === "completed",
            data.status === "running"
          );

          if (!["running", "pending", "queued"].includes(data.status)) {
            clearTimeout(jobTimer);
            jobTimer = null;
            activeJobId = "";
            activeJobDate = "";

            if (data.result) {
              if (data.type === "analyze" && data.status === "completed") {
                lastAnalyzeTargets = data.result.targets || data.payload?.targets || [];
                lastPromptPreset = data.result.preset || data.payload?.preset || currentScene;
                lastAnalysisPreset = lastPromptPreset;
                lastAnalysisContext = data.result.context || null;
                lastAnalysisModel = data.result.model || data.payload?.model || selectedKimiModel();
                setPromptContent(data.result.prompt || "");
                setAnalysisContent(data.result.analysis || "");
                renderAnalysisMeta();
              }
            }

            if (data.status === "failed") {
              setStatus(data.error || "任务失败");
            }
            if (data.type === "fetch") {
              const targets = data.payload?.targets || data.result?.targets || [];
              failedTargets = [...new Set([...failedTargets.filter(target => !targets.includes(target)),
                ...targets.filter(target => data.target_statuses?.[target] === "failed")])];
              if (data.status === "failed" && !failedTargets.length) failedTargets = [...targets];
            }
            try { await refreshState(date); }
            catch (err) {
              setStatus((data.status === "completed" ? "任务已完成，但资料状态刷新失败：" : "任务失败，且状态刷新失败：") + normalizeErrorMessage(err));
            }
            finishTaskProgress(data.status, [phaseText, data.status === "failed" ? data.error || "请查看执行日志" : buildLoadingDetail(data)].filter(Boolean).join("\n"));
            return data;
          }
          await new Promise(resolve => { jobTimer = setTimeout(resolve, 1000); });
        }
      } finally { jobPolling = false; }
    }

    async function resumeActiveJob() {
      if (!activeJobId || jobPolling) return;
      setWorkspaceBusy(true);
      showLoading("正在恢复原任务查询…");
      try { return await followJob(activeJobId, activeJobDate); }
      finally { if (!activeJobId) { hideLoading(); setWorkspaceBusy(false); } }
    }

    async function writeTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "readonly");
      helper.style.position = "fixed";
      helper.style.top = "-9999px";
      helper.style.left = "-9999px";
      document.body.appendChild(helper);
      helper.focus();
      helper.select();
      const copied = document.execCommand("copy");
      document.body.removeChild(helper);
      if (!copied) {
        throw new Error("复制失败，请检查浏览器权限");
      }
    }

    async function copyPrompt() {
      const editorValue = document.getElementById("promptEditor").value;
      const text = editorValue || lastPrompt;
      if (!text || text === "尚未生成 AI 提示词。") {
        setStatus("当前没有可复制的提示词");
        return;
      }
      try {
        await writeTextToClipboard(text);
        setStatus("提示词全文已复制", true);
      } catch (err) {
        setStatus(err && err.message ? err.message : "复制失败，请检查浏览器权限");
      }
    }

    function resetPrompt() {
      setPromptContent(lastPrompt);
      setStatus("提示词已恢复", true);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    document.getElementById("tradeDate").addEventListener("change", () => {
      refreshState().catch((err) => setStatus(normalizeErrorMessage(err)));
    });
    document.getElementById("kimiKey").addEventListener("input", resetModelsForKeyInput);
    document.getElementById("kimiModel").addEventListener("input", () => {
      const picker = document.getElementById("kimiModelOptions");
      picker.value = selectedKimiModel();
      if (picker.selectedIndex < 0) picker.value = "";
      setModelFeedback(selectedKimiModel() ? "本次使用 " + selectedKimiModel() + "；可先测试，再保存默认配置。" : "请选择或输入模型 ID。");
      updateWorkspace(false);
    });
    document.getElementById("kimiModelOptions").addEventListener("change", event => {
      document.getElementById("kimiModel").value = event.target.value;
      document.getElementById("kimiModel").dispatchEvent(new Event("input"));
    });
    applyStaticCopy();
    document.addEventListener("visibilitychange", scheduleQuoteRotation);
    window.addEventListener("pagehide", stopQuoteRotation);
    window.addEventListener("pageshow", scheduleQuoteRotation);
    rotateSidebarQuote();
    renderTags();
    try {
      if (!localStorage.getItem(STORAGE_KEYS.scene) && QUICK_FLOWS[currentScene] && [...selectedTargets].some(target => !QUICK_FLOWS[currentScene].targets.includes(target))) {
        selectScene("default", false);
      }
    } catch {}
    renderProgress();
    updateMetrics();
    Promise.all([refreshState(), loadSettings()]).catch((err) => setStatus(normalizeErrorMessage(err)));
  </script>
</body>
</html>
